<div class="tree">
  <label class="tree-row tree-level-0">
    <input type="checkbox" [checked]="globalState === 'all'" [indeterminate]="globalState === 'some'" (change)="toggleGlobal()" />
    <span class="tree-label">Global</span>
  </label>

  <div *ngFor="let region of regionService.regions()">
    <div class="tree-row tree-level-1">
      <button type="button" class="tree-toggle" (click)="toggleRegionExpanded(region)" [class.expanded]="expandedRegionIds.has(region.id)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 6 15 12 9 18"></polyline></svg>
      </button>
      <label class="tree-check">
        <input type="checkbox" [checked]="regionState(region) === 'all'" [indeterminate]="regionState(region) === 'some'" (change)="toggleRegion(region)" />
        <span class="tree-label">{{ tsService.translate(region.name) }}</span>
        <span class="tree-count">{{ regionCountries(region).length }}</span>
      </label>
    </div>

    <ng-container *ngIf="expandedRegionIds.has(region.id)">
      <label class="tree-row tree-level-2" *ngFor="let country of regionCountries(region)">
        <input type="checkbox" [checked]="isCountrySelected(country.id)" (change)="toggleCountry(country.id)" />
        <span class="tree-label">{{ tsService.translate(country.name) }}</span>
        <span class="tree-code">{{ country.code }}</span>
      </label>
      <p class="tree-empty" *ngIf="!regionCountries(region).length">{{ tsService.translate('Bu bölgede ülke tanımlı değil.') }}</p>
    </ng-container>
  </div>
</div>
