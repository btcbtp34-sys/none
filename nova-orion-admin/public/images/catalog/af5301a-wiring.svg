<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="520" fill="#ffffff"/>

  <!-- Power terminal block -->
  <rect x="40" y="70" width="120" height="190" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="100" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">TB1 · GÜÇ</text>
  <g font-size="13" font-weight="700" fill="#0f172a">
    <rect x="60" y="85" width="80" height="26" rx="3" fill="#ffffff" stroke="#475569"/><text x="100" y="103" text-anchor="middle">L1</text>
    <rect x="60" y="117" width="80" height="26" rx="3" fill="#ffffff" stroke="#475569"/><text x="100" y="135" text-anchor="middle">L2</text>
    <rect x="60" y="149" width="80" height="26" rx="3" fill="#ffffff" stroke="#475569"/><text x="100" y="167" text-anchor="middle">L3</text>
    <rect x="60" y="181" width="80" height="26" rx="3" fill="#ffffff" stroke="#475569"/><text x="100" y="199" text-anchor="middle">N</text>
    <rect x="60" y="213" width="80" height="26" rx="3" fill="#ffffff" stroke="#475569"/><text x="100" y="231" text-anchor="middle">⏚</text>
  </g>
  <text x="100" y="285" text-anchor="middle" font-size="11" fill="#475569">380-415V / 3Ph / 50Hz</text>

  <!-- Main PCB -->
  <rect x="300" y="60" width="220" height="210" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="410" y="88" text-anchor="middle" font-size="14" font-weight="800" fill="#065f46">ANA KONTROL KARTI</text>
  <text x="410" y="106" text-anchor="middle" font-size="11" fill="#047857">PCB-1</text>
  <rect x="320" y="125" width="80" height="50" rx="4" fill="#ffffff" stroke="#047857"/>
  <text x="360" y="155" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">İNVERTER</text>
  <rect x="420" y="125" width="80" height="50" rx="4" fill="#ffffff" stroke="#047857"/>
  <text x="460" y="155" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">FAN SÜRÜCÜ</text>
  <rect x="320" y="195" width="180" height="55" rx="4" fill="#ffffff" stroke="#047857"/>
  <text x="410" y="218" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">SENSÖR GİRİŞLERİ</text>
  <text x="410" y="236" text-anchor="middle" font-size="10" fill="#047857">Th1 · Th2 · Th3 · PS-H · PS-L</text>

  <!-- Power wiring -->
  <g fill="none" stroke-width="2.4">
    <path d="M140 98 H 250 V 140 H 320" stroke="#7c3f00"/>
    <path d="M140 130 H 240 V 148 H 320" stroke="#111827"/>
    <path d="M140 162 H 230 V 156 H 320" stroke="#6b7280"/>
    <path d="M140 194 H 260 V 164 H 320" stroke="#2563eb"/>
    <path d="M140 226 H 220 V 300 H 410 V 270" stroke="#16a34a" stroke-dasharray="8 4"/>
  </g>

  <!-- Compressor -->
  <circle cx="360" cy="400" r="48" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="360" y="406" text-anchor="middle" font-size="20" font-weight="800" fill="#c2410c">M</text>
  <text x="360" y="470" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">KOMPRESÖR (CM1)</text>
  <path d="M360 175 V 352" fill="none" stroke="#c2410c" stroke-width="2.4"/>

  <!-- Fan motors -->
  <circle cx="560" cy="400" r="34" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="560" y="406" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">M</text>
  <text x="560" y="455" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">FAN MOTOR 1</text>
  <circle cx="680" cy="400" r="34" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="680" y="406" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">M</text>
  <text x="680" y="455" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">FAN MOTOR 2</text>
  <g fill="none" stroke="#1d4ed8" stroke-width="2.4">
    <path d="M480 175 V 320 H 560 V 366"/>
    <path d="M490 175 V 310 H 680 V 366"/>
  </g>

  <!-- Communication terminal -->
  <rect x="610" y="90" width="150" height="110" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <text x="685" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">TB2 · HABERLEŞME</text>
  <g font-size="13" font-weight="700" fill="#0f172a">
    <rect x="630" y="108" width="110" height="26" rx="3" fill="#ffffff" stroke="#475569"/><text x="685" y="126" text-anchor="middle">1 · İç Ünite</text>
    <rect x="630" y="144" width="110" height="26" rx="3" fill="#ffffff" stroke="#475569"/><text x="685" y="162" text-anchor="middle">2 · İç Ünite</text>
  </g>
  <path d="M520 150 H 630" fill="none" stroke="#9333ea" stroke-width="2.4"/>

  <!-- Title -->
  <text x="40" y="500" font-size="13" font-weight="800" fill="#0f172a">NONE · AF5301A 25-3 · WIRING DIAGRAM</text>
  <g font-size="11" fill="#475569">
    <line x1="520" y1="492" x2="545" y2="492" stroke="#7c3f00" stroke-width="3"/><text x="550" y="496">Faz</text>
    <line x1="590" y1="492" x2="615" y2="492" stroke="#2563eb" stroke-width="3"/><text x="620" y="496">Nötr</text>
    <line x1="665" y1="492" x2="690" y2="492" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 3"/><text x="695" y="496">Toprak</text>
  </g>
</svg>
