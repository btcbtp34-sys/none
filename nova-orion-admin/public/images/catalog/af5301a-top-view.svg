<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#eef2f6" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="700" height="500" fill="#ffffff"/>
  <rect width="700" height="500" fill="url(#grid)"/>

  <!-- Outline -->
  <rect x="130" y="130" width="440" height="200" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Front edge (air discharge side) -->
  <line x1="130" y1="330" x2="570" y2="330" stroke="#0f172a" stroke-width="5"/>
  <!-- Rear coil -->
  <rect x="140" y="138" width="420" height="16" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <!-- Service panel -->
  <rect x="470" y="180" width="90" height="140" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Fan guards -->
  <g fill="none" stroke="#0f172a" stroke-width="1.4">
    <circle cx="235" cy="235" r="78"/><circle cx="235" cy="235" r="58"/><circle cx="235" cy="235" r="38"/>
    <circle cx="380" cy="235" r="78"/><circle cx="380" cy="235" r="58"/><circle cx="380" cy="235" r="38"/>
  </g>
  <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="8 4">
    <line x1="235" y1="145" x2="235" y2="325"/><line x1="145" y1="235" x2="325" y2="235"/>
    <line x1="380" y1="145" x2="380" y2="325"/><line x1="290" y1="235" x2="470" y2="235"/>
  </g>

  <!-- Pipe connections -->
  <g fill="#ffffff" stroke="#b08d3a" stroke-width="2.5">
    <circle cx="545" cy="300" r="8"/>
    <circle cx="520" cy="300" r="6"/>
  </g>
  <text x="532" y="350" text-anchor="middle" font-size="11" fill="#475569">Gaz / Sıvı</text>

  <!-- Dimensions -->
  <g stroke="#2563eb" stroke-width="1.3" fill="none">
    <line x1="130" y1="90" x2="570" y2="90" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="130" y1="80" x2="130" y2="125"/><line x1="570" y1="80" x2="570" y2="125"/>
    <line x1="610" y1="130" x2="610" y2="330" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="575" y1="130" x2="620" y2="130"/><line x1="575" y1="330" x2="620" y2="330"/>
  </g>
  <g fill="#2563eb" font-size="15" font-weight="700" text-anchor="middle">
    <text x="350" y="80">W</text>
    <text x="632" y="236">D</text>
  </g>

  <!-- Front label -->
  <text x="350" y="362" text-anchor="middle" font-size="12" fill="#475569" letter-spacing="1">ÖN (HAVA ÇIKIŞI)</text>

  <!-- Title block -->
  <g>
    <rect x="410" y="400" width="260" height="70" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="410" y1="430" x2="670" y2="430" stroke="#0f172a" stroke-width="1"/>
    <text x="420" y="421" font-size="14" font-weight="800" fill="#0f172a">NONE · AF5301A 25-3</text>
    <text x="420" y="453" font-size="12" fill="#475569">TOP VIEW</text>
    <text x="660" y="453" font-size="12" fill="#475569" text-anchor="end">Ölçek: —</text>
  </g>
</svg>
