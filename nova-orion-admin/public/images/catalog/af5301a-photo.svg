<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eef3"/>
    </radialGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfdfe"/>
      <stop offset="0.55" stop-color="#e8edf2"/>
      <stop offset="1" stop-color="#cfd8e1"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c3ccd6"/>
      <stop offset="1" stop-color="#9eabb9"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#eef2f6"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="fanWell" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b6777"/>
      <stop offset="0.75" stop-color="#2f3946"/>
      <stop offset="1" stop-color="#1f2731"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8794a3"/>
      <stop offset="1" stop-color="#4b5664"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="coil" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#7b8794"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#3f4a57" stroke-width="2.2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <g id="fan">
      <circle r="118" fill="url(#fanWell)"/>
      <g fill="url(#blade)" opacity="0.95">
        <path d="M0 0 C 30 -40, 85 -70, 108 -40 C 85 -20, 45 -5, 0 0 Z"/>
        <path d="M0 0 C 30 -40, 85 -70, 108 -40 C 85 -20, 45 -5, 0 0 Z" transform="rotate(120)"/>
        <path d="M0 0 C 30 -40, 85 -70, 108 -40 C 85 -20, 45 -5, 0 0 Z" transform="rotate(240)"/>
      </g>
      <circle r="24" fill="#cfd6de" stroke="#8a96a3" stroke-width="2"/>
      <g fill="none" stroke="#e5e9ee" stroke-width="2.4">
        <circle r="112"/><circle r="94"/><circle r="76"/><circle r="58"/><circle r="40"/>
        <line x1="-112" y1="0" x2="112" y2="0"/>
        <line x1="0" y1="-112" x2="0" y2="112"/>
        <line x1="-79" y1="-79" x2="79" y2="79"/>
        <line x1="-79" y1="79" x2="79" y2="-79"/>
      </g>
    </g>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="410" cy="700" rx="300" ry="26" fill="#94a3b8" opacity="0.45" filter="url(#shadow)"/>

  <!-- Body -->
  <polygon points="140,150 520,150 640,90 260,90" fill="url(#top)" stroke="#b6c1cc" stroke-width="2"/>
  <polygon points="520,150 640,90 640,610 520,680" fill="url(#side)"/>
  <polygon points="532,170 628,118 628,598 532,654" fill="url(#coil)" opacity="0.9"/>
  <rect x="140" y="150" width="380" height="530" fill="url(#front)" stroke="#b6c1cc" stroke-width="2"/>

  <!-- Fans (front discharge) -->
  <rect x="158" y="170" width="262" height="242" rx="10" fill="#dfe5eb" stroke="#b6c1cc" stroke-width="2"/>
  <rect x="158" y="420" width="262" height="242" rx="10" fill="#dfe5eb" stroke="#b6c1cc" stroke-width="2"/>
  <use href="#fan" x="289" y="291"/>
  <use href="#fan" x="289" y="541"/>

  <!-- Service panel -->
  <rect x="432" y="170" width="74" height="492" rx="6" fill="#f1f4f7" stroke="#c4cdd6" stroke-width="2"/>
  <rect x="440" y="200" width="58" height="34" rx="4" fill="url(#plate)"/>
  <text x="469" y="223" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="1.5">NONE</text>
  <text x="469" y="258" text-anchor="middle" font-size="9" font-weight="700" fill="#475569">AF5301A</text>
  <rect x="452" y="420" width="34" height="14" rx="3" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <rect x="446" y="560" width="46" height="62" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="452" y1="572" x2="486" y2="572"/><line x1="452" y1="582" x2="480" y2="582"/>
    <line x1="452" y1="592" x2="486" y2="592"/><line x1="452" y1="602" x2="474" y2="602"/>
  </g>

  <!-- Pipe valves on side -->
  <g>
    <rect x="560" y="600" width="20" height="30" rx="3" fill="#b08d3a"/>
    <rect x="590" y="585" width="18" height="26" rx="3" fill="#b08d3a"/>
    <circle cx="570" cy="598" r="6" fill="#d6b25c"/>
    <circle cx="599" cy="583" r="5" fill="#d6b25c"/>
  </g>

  <!-- Feet -->
  <g fill="#334155">
    <path d="M165 680 h90 l10 18 h-110 z"/>
    <path d="M405 680 h90 l10 18 h-110 z"/>
    <path d="M560 664 l60 -34 v14 l-60 34 z" fill="#1e293b"/>
  </g>
</svg>
